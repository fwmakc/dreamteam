<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream Team</title>
  <link rel="icon" href="data:,">
  <script>
    // До загрузки Vue и CSS: сохранённая тема без вспышки индиго при старте.
    try {
      const saved = localStorage.getItem('dt-theme');
      document.documentElement.dataset.theme = ['light', 'dark', 'indigo'].includes(saved) ? saved : 'auto';
    } catch {
      document.documentElement.dataset.theme = 'auto';
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
