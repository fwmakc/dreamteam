<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Team</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <span id="logo">🎬 Dream Team</span>
  <span id="badge-user" class="badge clickable" title="Настройки пользователя">👤</span>
  <span id="badge-manager" class="badge clickable" title="Настройки менеджера">🛎</span>
  <button id="btn-settings-top" class="tb-btn" title="Настройки">⚙</button>
  <button id="btn-export-home" class="tb-btn" title="Экспорт дома (настройки + история, без .env)">⬇</button>
  <button id="btn-import-home" class="tb-btn" title="Импорт дома из zip">⬆</button>
  <span class="spacer"></span>
  <span id="conn" class="conn off">подключение…</span>
  <button id="btn-logout" class="hidden" title="Забыть токен доступа на этом устройстве">Выйти</button>
</header>

<div id="auth" class="hidden">
  <div class="auth-box">
    <h2>Доступ к Dream Team</h2>
    <p class="dim">Введите токен доступа (TOKEN из ~/.dreamteam/.env сервера).</p>
    <input id="auth-token" type="password" placeholder="токен" autocomplete="current-password">
    <div id="auth-error" class="errline hidden"></div>
    <button id="auth-enter">Войти</button>
  </div>
</div>
<main id="layout">
  <aside id="sidebar">
    <section class="side-sec" data-sec="sessions">
      <div class="side-head" data-toggle>
        <span class="sec-toggle" title="Свернуть/развернуть">▾</span>
        <span class="sec-name">Сессии</span>
        <button class="sec-add" title="Новый разговор">＋</button>
      </div>
      <div class="sec-btns">
        <button id="btn-export-session" title="Экспорт текущего разговора в zip">⬇ сессия</button>
        <button id="btn-import-session" title="Импорт разговора из zip">⬆ импорт</button>
      </div>
      <input type="file" id="import-file" accept=".zip" class="hidden">
      <ul id="sessions"></ul>
    </section>
    <section class="side-sec collapsed" data-sec="team">
      <div class="side-head" data-toggle>
        <span class="sec-toggle" title="Свернуть/развернуть">▾</span>
        <span class="sec-name">Команда</span>
        <button class="sec-add" title="Новый агент">＋</button>
      </div>
      <ul id="team"></ul>
    </section>
    <section class="side-sec collapsed" data-sec="providers">
      <div class="side-head" data-toggle>
        <span class="sec-toggle" title="Свернуть/развернуть">▾</span>
        <span class="sec-name">Провайдеры</span>
        <button class="sec-add" title="Новый провайдер">＋</button>
      </div>
      <ul id="providers"></ul>
    </section>
    <section class="side-sec collapsed" data-sec="schedule">
      <div class="side-head" data-toggle>
        <span class="sec-toggle" title="Свернуть/развернуть">▾</span>
        <span class="sec-name">Расписание</span>
        <button class="sec-add" title="Новая задача">＋</button>
      </div>
      <ul id="schedule-list"></ul>
    </section>
    <section class="side-sec collapsed" data-sec="projects">
      <div class="side-head" data-toggle>
        <span class="sec-toggle" title="Свернуть/развернуть">▾</span>
        <span class="sec-name">Проекты</span>
        <button class="sec-add" title="Новый проект">＋</button>
      </div>
      <ul id="projects"></ul>
    </section>
  </aside>

  <section id="chatwrap">
    <div id="chat">
      <div id="msgs"></div>
      <div id="feed"></div>
    </div>

    <div id="confirm" class="panel hidden">
      <div id="confirm-text"></div>
      <div id="confirm-desc" class="dim"></div>
      <div class="row">
        <button id="confirm-yes" class="ok">✓ Разрешить</button>
        <button id="confirm-no" class="bad">✗ Отказать</button>
      </div>
    </div>

    <div id="choose" class="panel hidden">
      <div class="side-head" data-toggle>Какой разговор приложить?</div>
      <ul id="choose-list"></ul>
      <div class="row"><button id="choose-cancel">Никакой</button></div>
    </div>

    <div id="statusbar" class="hidden">
      <span id="busy-label"></span>
      <button id="btn-abort" title="Прервать раунд (Esc в терминале)">⏹ Прервать</button>
      <button id="btn-auto" title="Автономный режим: агенты решают вопросы сами">🤖 Авто</button>
    </div>

    <div id="hints" class="hidden"></div>

    <div id="inputrow">
      <button id="btn-attach" title="Прикрепить файл (положится в inbox проекта)">📎</button>
      <input type="file" id="attach-file" class="hidden">
      <textarea id="input" rows="1"
        placeholder="Напишите команде… (Enter — отправить, Shift+Enter — новая строка, @имя — участнику, /help — команды)"></textarea>
      <button id="btn-send" title="Отправить">➤</button>
    </div>
  </section>
</main>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-fields"></div>
    <div id="modal-error" class="errline hidden"></div>
    <div class="row">
      <button id="modal-ok">Сохранить</button>
      <button id="modal-cancel">Отмена</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
